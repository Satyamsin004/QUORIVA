server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    connection-timeout: 20000
    max-connections: 10000

spring:
  application:
    name: cs-scholar-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cs_scholar_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: CsScholarHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      roles: ADMIN
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    clamav:
      enabled: true

ai-service:
  url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  internal-key: ${INTERNAL_SERVICE_KEY:cs_scholar_internal_service_secret_key_change_in_production}

jwt:
  secret: ${JWT_SECRET:cs_scholar_ai_super_secure_jwt_secret_key_for_development_minimum_256_bits_length!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours for smooth local development
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days (604,800,000 ms)

security:
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1,localhost}
  antivirus:
    clamav:
      enabled: ${CLAMAV_ENABLED:false}
      required: ${CLAMAV_REQUIRED:false}
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout-ms: ${CLAMAV_TIMEOUT_MS:10000}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:cs-scholar-documents}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:900}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:52428800} # 50 MB


